<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>거북이 폰포코 레트로 플랫폼</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070912;
      --panel: #101625;
      --ink: #f8f1d9;
      --cyan: #58e0ff;
      --lime: #85ff75;
      --rose: #ff5b8f;
      --gold: #ffd45a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: radial-gradient(circle at top, #17203a 0, var(--bg) 52%, #03040a 100%);
      color: var(--ink);
      font-family: "Courier New", Consolas, monospace;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .cabinet {
      width: min(96vw, 980px);
      padding: 16px;
      background: linear-gradient(180deg, #151d31, #080b14);
      border: 4px solid #283653;
      box-shadow: 0 0 0 4px #050711, 0 24px 70px rgba(0, 0, 0, .55);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      background: #070912;
      border: 3px solid #52607d;
      outline: none;
    }

    .hint {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: #c7d1ef;
      text-transform: uppercase;
    }

    .hint span {
      white-space: nowrap;
    }

    @media (max-width: 620px) {
      .cabinet {
        width: 100vw;
        padding: 8px;
        border-width: 2px;
      }

      .hint {
        font-size: 11px;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <main class="cabinet">
    <canvas id="game" width="800" height="600" tabindex="0" aria-label="거북이와 토끼 레트로 플랫폼 게임"></canvas>
    <div class="hint">
      <span>← → 이동</span>
      <span>↑ ↓ 사다리</span>
      <span>Space 점프</span>
      <span>Enter 시작 / 재시작</span>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;
      const HUD = 62;
      const keys = new Set();
      const tile = 4;
      let audioCtx = null;
      let highScore = Number(localStorage.getItem("turtlePomHighScore") || 0);

      const game = {
        state: "title",
        score: 0,
        lives: 3,
        stage: 1,
        timer: 120,
        messageTime: 0,
        respawnTime: 0,
        cameraShake: 0,
        lastTime: 0,
        level: null,
        player: null
      };

      const basePlatforms = [
        { x: 42, y: 540, w: 716, h: 16, gaps: [{ x: 342, w: 58 }], spikes: [{ x: 548, w: 50 }] },
        { x: 92, y: 452, w: 616, h: 16, gaps: [{ x: 236, w: 46 }], spikes: [{ x: 132, w: 42 }] },
        { x: 38, y: 364, w: 610, h: 16, gaps: [{ x: 468, w: 48 }], spikes: [{ x: 320, w: 46 }] },
        { x: 152, y: 276, w: 606, h: 16, gaps: [{ x: 600, w: 48 }], spikes: [{ x: 214, w: 42 }] },
        { x: 66, y: 188, w: 610, h: 16, gaps: [{ x: 250, w: 48 }], spikes: [{ x: 472, w: 42 }] },
        { x: 230, y: 104, w: 332, h: 16, gaps: [], spikes: [] }
      ];

      const ladders = [
        { x: 126, y: 452, h: 88 },
        { x: 404, y: 364, h: 176 },
        { x: 626, y: 276, h: 176 },
        { x: 190, y: 188, h: 176 },
        { x: 508, y: 104, h: 172 }
      ];

      function play(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const tones = {
          jump: [360, 650, .08, "square"],
          item: [820, 1250, .09, "triangle"],
          hurt: [190, 70, .28, "sawtooth"],
          clear: [520, 980, .36, "square"],
          start: [260, 520, .18, "square"]
        }[type];
        if (!tones) return;
        osc.type = tones[3];
        osc.frequency.setValueAtTime(tones[0], now);
        osc.frequency.exponentialRampToValueAtTime(tones[1], now + tones[2]);
        gain.gain.setValueAtTime(.001, now);
        gain.gain.exponentialRampToValueAtTime(.16, now + .01);
        gain.gain.exponentialRampToValueAtTime(.001, now + tones[2]);
        osc.start(now);
        osc.stop(now + tones[2] + .02);
      }

      function solidSegments(platform) {
        let segs = [{ x: platform.x, w: platform.w }];
        for (const gap of platform.gaps) {
          const next = [];
          for (const seg of segs) {
            const a = seg.x;
            const b = seg.x + seg.w;
            const ga = gap.x;
            const gb = gap.x + gap.w;
            if (gb <= a || ga >= b) next.push(seg);
            else {
              if (ga > a) next.push({ x: a, w: ga - a });
              if (gb < b) next.push({ x: gb, w: b - gb });
            }
          }
          segs = next;
        }
        return segs.map(seg => ({ x: seg.x, y: platform.y, w: seg.w, h: platform.h }));
      }

      function makeLevel(stage) {
        const items = [];
        basePlatforms.forEach((p, pi) => {
          solidSegments(p).forEach(seg => {
            const count = Math.max(1, Math.floor(seg.w / 118));
            for (let i = 0; i < count; i++) {
              const x = seg.x + 34 + i * (seg.w - 68) / Math.max(1, count - 1);
              if (x > seg.x + 16 && x < seg.x + seg.w - 16) {
                items.push({ x, y: p.y - 22, r: 8, type: (pi + i) % 2 ? "carrot" : "apple", got: false });
              }
            }
          });
        });

        const enemies = [
          { platform: 1, x: 520, dir: -1 },
          { platform: 2, x: 110, dir: 1 },
          { platform: 3, x: 680, dir: -1 }
        ];
        for (let i = 0; i < stage; i++) {
          enemies.push({ platform: i % 5, x: 180 + (i * 133) % 470, dir: i % 2 ? -1 : 1 });
        }

        return {
          platforms: basePlatforms,
          ladders,
          items,
          enemies: enemies.slice(0, Math.min(8, 3 + stage)).map((e, i) => ({
            x: e.x,
            y: basePlatforms[e.platform].y - 27,
            w: 30,
            h: 26,
            dir: e.dir,
            speed: 48 + stage * 9 + i * 3,
            platform: e.platform,
            climbChance: .18 + stage * .025,
            climbCooldown: 1 + i * .2,
            onLadder: false,
            ladder: null,
            vy: 0,
            anim: 0
          }))
        };
      }

      function resetStage(fullReset = false) {
        if (fullReset) {
          game.score = 0;
          game.lives = 3;
          game.stage = 1;
        }
        game.timer = Math.max(55, 125 - game.stage * 7);
        game.level = makeLevel(game.stage);
        game.player = {
          x: 70,
          y: 500,
          w: 30,
          h: 34,
          vx: 0,
          vy: 0,
          dir: 1,
          grounded: false,
          onLadder: false,
          ladder: null,
          anim: 0
        };
      }

      function startGame() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        game.state = "playing";
        resetStage(true);
        play("start");
      }

      function rects(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function nearbyLadder(actor) {
        return game.level.ladders.find(l =>
          actor.x + actor.w / 2 > l.x - 14 &&
          actor.x + actor.w / 2 < l.x + 38 &&
          actor.y + actor.h > l.y &&
          actor.y < l.y + l.h + 20
        );
      }

      function platformUnder(actor) {
        for (const p of game.level.platforms) {
          for (const seg of solidSegments(p)) {
            const feet = actor.y + actor.h;
            if (actor.x + actor.w > seg.x && actor.x < seg.x + seg.w && feet <= seg.y + 15 && feet + actor.vy / 18 >= seg.y) {
              return seg;
            }
          }
        }
        return null;
      }

      function platformAtFeet(actor, tolerance = 7) {
        for (const p of game.level.platforms) {
          for (const seg of solidSegments(p)) {
            const feet = actor.y + actor.h;
            if (
              actor.x + actor.w > seg.x &&
              actor.x < seg.x + seg.w &&
              Math.abs(feet - seg.y) <= tolerance
            ) {
              return seg;
            }
          }
        }
        return null;
      }

      function hurt() {
        if (game.respawnTime > 0 || game.state !== "playing") return;
        game.lives--;
        game.cameraShake = 14;
        play("hurt");
        if (game.lives <= 0) {
          game.state = "gameover";
          highScore = Math.max(highScore, game.score);
          localStorage.setItem("turtlePomHighScore", String(highScore));
        } else {
          game.respawnTime = 1.1;
        }
      }

      function updatePlayer(dt) {
        const p = game.player;
        const speed = 168 + game.stage * 6;
        const ladder = nearbyLadder(p);
        const wantsClimb = keys.has("ArrowUp") || keys.has("ArrowDown");

        if (ladder && wantsClimb) {
          p.onLadder = true;
          p.ladder = ladder;
          p.x += (ladder.x + 4 - p.x) * Math.min(1, dt * 9);
          p.vy = 0;
        }

        if (p.onLadder) {
          const climb = (keys.has("ArrowUp") ? -1 : 0) + (keys.has("ArrowDown") ? 1 : 0);
          const oldFeet = p.y + p.h;
          p.vy = climb * 118;
          p.y += p.vy * dt;
          p.vx = 0;
          p.anim += Math.abs(climb) * dt * 10;
          const crossedFloor = climb > 0
            ? game.level.platforms
              .flatMap(platform => solidSegments(platform))
              .find(seg =>
                p.x + p.w > seg.x &&
                p.x < seg.x + seg.w &&
                oldFeet < seg.y - 2 &&
                p.y + p.h >= seg.y
              )
            : null;
          const restingFloor = platformAtFeet(p);
          if (crossedFloor || (!wantsClimb && restingFloor)) {
            const floor = crossedFloor || restingFloor;
            p.y = floor.y - p.h;
            p.vy = 0;
            p.onLadder = false;
            p.grounded = true;
          } else if (!nearbyLadder(p)) {
            p.onLadder = false;
          }
        } else {
          const move = (keys.has("ArrowRight") ? 1 : 0) - (keys.has("ArrowLeft") ? 1 : 0);
          p.vx = move * speed;
          if (move) p.dir = move;
          p.x += p.vx * dt;
          p.vy += 760 * dt;
          p.y += p.vy * dt;
          p.anim += Math.abs(move) * dt * 12;
        }

        p.x = Math.max(10, Math.min(W - p.w - 10, p.x));
        const floor = platformUnder(p);
        if (!p.onLadder && floor && p.vy >= 0) {
          p.y = floor.y - p.h;
          p.vy = 0;
          p.grounded = true;
        } else {
          p.grounded = false;
        }

        if (keys.has("Space") && p.grounded && !p.onLadder) {
          p.vy = -355;
          p.grounded = false;
          keys.delete("Space");
          play("jump");
        }

        for (const plat of game.level.platforms) {
          for (const spike of plat.spikes) {
            if (rects(p, { x: spike.x, y: plat.y - 16, w: spike.w, h: 18 })) hurt();
          }
        }
        if (p.y > H + 40 || game.timer <= 0) hurt();
      }

      function updateEnemies(dt) {
        for (const e of game.level.enemies) {
          e.anim += dt * 10;
          e.climbCooldown -= dt;
          const possible = nearbyLadder(e);
          if (!e.onLadder && possible && e.climbCooldown <= 0 && Math.random() < e.climbChance * dt) {
            e.onLadder = true;
            e.ladder = possible;
            e.vy = Math.random() < .5 ? -70 - game.stage * 6 : 70 + game.stage * 6;
            e.x = possible.x + 3;
          }
          if (e.onLadder) {
            e.y += e.vy * dt;
            if (!nearbyLadder(e) || Math.random() < .5 * dt) {
              e.onLadder = false;
              e.climbCooldown = 1.8;
            }
          } else {
            e.x += e.dir * e.speed * dt;
            const seg = solidSegments(game.level.platforms[e.platform]).find(s => e.x + e.w / 2 > s.x && e.x + e.w / 2 < s.x + s.w);
            if (!seg || e.x < seg.x + 8 || e.x + e.w > seg.x + seg.w - 8) {
              e.dir *= -1;
              e.x += e.dir * e.speed * dt * 2;
            }
            e.y = game.level.platforms[e.platform].y - e.h;
          }
          if (rects(game.player, e)) hurt();
        }
      }

      function updateItems() {
        for (const item of game.level.items) {
          if (!item.got && rects(game.player, { x: item.x - item.r, y: item.y - item.r, w: item.r * 2, h: item.r * 2 })) {
            item.got = true;
            game.score += 100 + game.stage * 10;
            play("item");
          }
        }
        if (game.level.items.every(item => item.got)) {
          game.score += Math.ceil(game.timer) * 10;
          highScore = Math.max(highScore, game.score);
          localStorage.setItem("turtlePomHighScore", String(highScore));
          game.state = "clear";
          game.messageTime = 1.8;
          play("clear");
        }
      }

      function update(dt) {
        if (game.state !== "playing") {
          if (game.state === "clear") {
            game.messageTime -= dt;
            if (game.messageTime <= 0) {
              game.stage++;
              game.state = "playing";
              resetStage(false);
            }
          }
          return;
        }
        if (game.respawnTime > 0) {
          game.respawnTime -= dt;
          if (game.respawnTime <= 0) resetStage(false);
          return;
        }
        game.timer -= dt;
        updatePlayer(dt);
        updateEnemies(dt);
        updateItems();
        game.cameraShake = Math.max(0, game.cameraShake - dt * 35);
      }

      function pxRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.round(x / tile) * tile, Math.round(y / tile) * tile, Math.round(w / tile) * tile, Math.round(h / tile) * tile);
      }

      function drawText(text, x, y, size = 18, align = "left", color = "#f8f1d9") {
        ctx.fillStyle = color;
        ctx.font = `${size}px "Courier New", monospace`;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        ctx.fillText(text, x, y);
      }

      function drawWorld() {
        ctx.fillStyle = "#070912";
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        if (game.cameraShake > 0) ctx.translate((Math.random() - .5) * game.cameraShake, (Math.random() - .5) * game.cameraShake);

        for (let y = HUD; y < H; y += 24) {
          ctx.fillStyle = y % 48 ? "#0b1020" : "#0e1630";
          ctx.fillRect(0, y, W, 2);
        }

        drawPlatforms();
        drawLadders();
        for (const item of game.level.items) if (!item.got) drawItem(item);
        for (const e of game.level.enemies) drawRabbit(e);
        if (game.respawnTime <= 0 || Math.floor(game.respawnTime * 12) % 2) drawTurtle(game.player);
        ctx.restore();
      }

      function drawPlatforms() {
        for (const p of game.level.platforms) {
          for (const seg of solidSegments(p)) {
            pxRect(seg.x, seg.y, seg.w, seg.h, "#384462");
            pxRect(seg.x, seg.y, seg.w, 4, "#8deaff");
            for (let x = seg.x; x < seg.x + seg.w; x += 28) pxRect(x, seg.y + 8, 12, 4, "#202944");
          }
          for (const spike of p.spikes) {
            for (let x = spike.x; x < spike.x + spike.w; x += 14) {
              ctx.fillStyle = "#ff5b8f";
              ctx.beginPath();
              ctx.moveTo(x, p.y);
              ctx.lineTo(x + 7, p.y - 18);
              ctx.lineTo(x + 14, p.y);
              ctx.fill();
            }
          }
        }
      }

      function drawLadders() {
        for (const l of game.level.ladders) {
          pxRect(l.x, l.y, 6, l.h, "#ffd45a");
          pxRect(l.x + 28, l.y, 6, l.h, "#ffd45a");
          for (let y = l.y + 10; y < l.y + l.h; y += 18) pxRect(l.x, y, 34, 5, "#ff9f43");
        }
      }

      function drawItem(item) {
        if (item.type === "apple") {
          pxRect(item.x - 8, item.y - 6, 16, 16, "#ff4f67");
          pxRect(item.x - 3, item.y - 12, 6, 6, "#7b4a26");
          pxRect(item.x + 3, item.y - 13, 8, 5, "#85ff75");
        } else {
          pxRect(item.x - 5, item.y - 8, 10, 18, "#ff9f43");
          pxRect(item.x - 7, item.y - 13, 14, 6, "#85ff75");
        }
      }

      function drawTurtle(p) {
        const bob = p.onLadder ? Math.sin(p.anim) * 3 : Math.abs(Math.sin(p.anim)) * 2;
        pxRect(p.x + 5, p.y + 12 + bob, 22, 18, "#287a49");
        pxRect(p.x + 9, p.y + 8 + bob, 14, 18, "#85ff75");
        pxRect(p.x + (p.dir > 0 ? 23 : -1), p.y + 13 + bob, 10, 10, "#a8ff9c");
        pxRect(p.x + (p.dir > 0 ? 29 : 1), p.y + 15 + bob, 3, 3, "#071018");
        pxRect(p.x + 8, p.y + 28 + bob, 5, 6, "#85ff75");
        pxRect(p.x + 20, p.y + 28 + bob, 5, 6, "#85ff75");
        pxRect(p.x + (p.dir > 0 ? 0 : 25), p.y + 19 + bob, 7, 6, "#85ff75");
      }

      function drawRabbit(e) {
        const hop = Math.abs(Math.sin(e.anim)) * 3;
        pxRect(e.x + 7, e.y + 9 - hop, 18, 17, "#f4f0ff");
        pxRect(e.x + (e.dir > 0 ? 20 : 2), e.y + 6 - hop, 11, 11, "#ffffff");
        pxRect(e.x + (e.dir > 0 ? 22 : 4), e.y - 8 - hop, 4, 15, "#ffffff");
        pxRect(e.x + (e.dir > 0 ? 27 : 9), e.y - 7 - hop, 4, 14, "#ff9fbd");
        pxRect(e.x + (e.dir > 0 ? 28 : 4), e.y + 9 - hop, 3, 3, "#09101b");
        pxRect(e.x + 8, e.y + 25 - hop, 6, 5, "#ffffff");
        pxRect(e.x + 20, e.y + 25 - hop, 6, 5, "#ffffff");
      }

      function drawHud() {
        ctx.fillStyle = "#101625";
        ctx.fillRect(0, 0, W, HUD);
        ctx.fillStyle = "#253151";
        ctx.fillRect(0, HUD - 4, W, 4);
        drawText(`점수 ${String(game.score).padStart(6, "0")}`, 18, 22, 17, "left", "#ffd45a");
        drawText(`최고 ${String(highScore).padStart(6, "0")}`, 18, 46, 16, "left", "#8deaff");
        drawText(`목숨 ${"♥".repeat(Math.max(0, game.lives))}`, 330, 22, 17, "left", "#ff5b8f");
        drawText(`스테이지 ${game.stage}`, 330, 46, 16, "left", "#85ff75");
        drawText(`시간 ${Math.max(0, Math.ceil(game.timer))}`, 690, 34, 20, "center", game.timer < 16 ? "#ff5b8f" : "#f8f1d9");
      }

      function drawOverlay(title, subtitle, color = "#ffd45a") {
        ctx.fillStyle = "rgba(3, 4, 10, .72)";
        ctx.fillRect(0, HUD, W, H - HUD);
        drawText(title, W / 2, 250, 42, "center", color);
        drawText(subtitle, W / 2, 306, 18, "center", "#f8f1d9");
      }

      function drawTitle() {
        drawWorld();
        drawOverlay("거북이 폰포코", "토끼들을 피하고 모든 먹이를 모으세요", "#85ff75");
        drawText("ENTER 시작", W / 2, 354, 22, "center", "#8deaff");
      }

      function render() {
        if (!game.level) resetStage(true);
        if (game.state === "title") drawTitle();
        else {
          drawWorld();
          if (game.state === "clear") drawOverlay("스테이지 클리어!", "잠시 후 다음 스테이지로 이동합니다", "#85ff75");
          if (game.state === "gameover") drawOverlay("게임 종료", "다시 시작하려면 Enter를 누르세요", "#ff5b8f");
        }
        drawHud();
      }

      function loop(t) {
        const dt = Math.min(.033, (t - game.lastTime) / 1000 || 0);
        game.lastTime = t;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      window.addEventListener("keydown", e => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
        keys.add(e.code);
        if (e.code === "Enter" && (game.state === "title" || game.state === "gameover")) startGame();
      });

      window.addEventListener("keyup", e => keys.delete(e.code));
      window.addEventListener("pointerdown", () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }, { once: true });

      resetStage(true);
      canvas.focus();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
